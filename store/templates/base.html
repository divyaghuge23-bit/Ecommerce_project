<!doctype html>
<html lang="en">

{% load static %}

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>

    <title>Python World</title>


<style>

nav {
    background-color: white;
}


.one-edge-shadow {
    box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}


.navbar-brand{
    font-size:24px;
    font-weight:bold;
}


.nav-link{
    font-size:16px;
    margin-left:10px;
}


.nav-link:hover{
    color:#ffd700 !important;
}


.dropdown-menu{
    border-radius:10px;
    box-shadow:0px 5px 15px rgba(0,0,0,0.2);
}


.dropdown-item{
    padding:10px 20px;
}


.dropdown-item:hover{
    background:#f1f1f1;
}


.search-box{
    width:400px;
}


.cart-badge{

    font-size:11px;
    position:absolute;
    top:-5px;
    right:-10px;

}


</style>


</head>



<body>


<!-- Navbar -->


<nav class="navbar navbar-expand-lg navbar-dark bg-primary one-edge-shadow sticky-top">


<div class="container">


<!-- Website Name -->

<a class="navbar-brand" href="/" 
   style="
   font-size:28px;
   font-weight:800;
   letter-spacing:1px;
   text-transform:uppercase;
   display:flex;
   align-items:center;
   text-decoration:none;
   ">

    <span style="
    font-size:30px;
    margin-right:8px;
    ">
    🛒
    </span>

    <span style="
    color:white;
    font-family:'Segoe UI',sans-serif;
    ">
        Omni<span style="color:#ffd700;">Cart</span>
    </span>

</a>




<button class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarSupportedContent">

<span class="navbar-toggler-icon"></span>

</button>




<div class="collapse navbar-collapse" id="navbarSupportedContent">



<!-- Search -->


<form class="form-inline mx-auto">

<input class="form-control search-box mr-2"
       type="search"
       placeholder="Search Product..."
       name="query">


<button class="btn btn-warning">
    Search
</button>


</form>





<ul class="navbar-nav ml-auto">



<!-- Home -->


<li class="nav-item active">

<a class="nav-link" href="/">

🏠 Home

</a>

</li>





<!-- Profile Dropdown -->


<li class="nav-item dropdown">


<a class="nav-link dropdown-toggle"
   href="#"
   data-toggle="dropdown">


👤 Profile


</a>



<div class="dropdown-menu dropdown-menu-right">


<a class="dropdown-item" 
href="{% url 'my_orders' %}">

📦 My Orders

</a>



<div class="dropdown-divider"></div>



<a class="dropdown-item text-danger"
href="{% url 'logout' %}">

🚪 Logout

</a>



</div>


</li>






<!-- Cart -->


<li class="nav-item">


<a href="{% url 'cart' %}" 
class="nav-link position-relative">


🛒 Cart


<span class="badge badge-danger cart-badge">

{{ cart_count }}

</span>


</a>


</li>






<!-- Register -->


<li class="nav-item">


<a class="nav-link"
href="{% url 'register' %}">


Register


</a>


</li>





</ul>



</div>



</div>


</nav>







<!-- Messages -->


{% if messages %}

{% for message in messages %}


<div class="alert alert-danger">

{{ message }}

</div>


{% endfor %}

{% endif %}






<!-- Page Content -->


{% block content %}

{% endblock %}








<!-- Bootstrap Scripts -->


<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js"></script>



</body>


</html>
