{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

<h2>📦 My Orders</h2>


{% for order in orders %}

<div class="card shadow mb-3">

<div class="card-body">

<div class="row">


<div class="col-md-3">

<img src="{{ order.product.image.url }}"
class="img-fluid"
style="height:120px;">

</div>


<div class="col-md-6">

<h4>
{{ order.product.name }}
</h4>

<p>
Quantity: {{ order.quantity }}
</p>

<p>
Amount: ₹{{ order.total_amount }}
</p>

<p>
Ordered Date:
{{ order.created_at }}
</p>


</div>


<div class="col-md-3">

<h5>Status</h5>

<span class="badge bg-success">
{{ order.status }}
</span>

</div>


</div>

</div>

</div>


{% empty %}

<h4>
No orders yet
</h4>

{% endfor %}


</div>


{% endblock %}
